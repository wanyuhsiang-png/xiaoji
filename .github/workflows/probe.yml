name: probe
on:
  push:
    branches: [claude/high-win-rate-stock-trading-8vy1mc]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://wanyuhsiang-png.github.io"
          U="https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/2330"
          echo "=== fugle preflight"
          curl -s -D - -o /dev/null -X OPTIONS -H "$O" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: x-api-key" "$U" | grep -i "access-control\|^HTTP"
          echo "=== fugle get (no key)"
          curl -s -D - -H "$O" -H "X-API-KEY: test" "$U" -o b.txt | grep -i "access-control\|^HTTP"; head -c 200 b.txt; echo
          echo "=== twse mis"
          curl -s -D - -o /dev/null -H "$O" "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw" | grep -i "access-control\|^HTTP"
