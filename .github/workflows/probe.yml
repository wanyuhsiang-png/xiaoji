name: probe
on:
  push:
    branches: [claude/high-win-rate-stock-trading-8vy1mc]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://wanyuhsiang-png.github.io"
          B="https://api.finmindtrade.com/api/v4/data"
          for q in "dataset=TaiwanStockPrice&data_id=2330&start_date=2026-09-25" \
                   "dataset=TaiwanStockPriceAdj&data_id=2330&start_date=2026-09-25" \
                   "dataset=TaiwanStockNews&data_id=2330&start_date=2026-10-01&end_date=2026-10-02" \
                   "dataset=TaiwanStockInfo&data_id=2330"; do
            echo "=== $q"
            curl -s -D - -H "$O" "$B?$q" -o body.txt | grep -i "access-control\|^HTTP"
            head -c 600 body.txt; echo
          done
          echo "=== preflight"
          curl -s -D - -o /dev/null -X OPTIONS -H "$O" -H "Access-Control-Request-Method: GET" "$B" | grep -i "access-control\|^HTTP"
          echo "=== google news rss"
          curl -s -D - -o /dev/null -H "$O" "https://news.google.com/rss/search?q=2330&hl=zh-TW&gl=TW&ceid=TW:zh-Hant" | grep -i "access-control\|^HTTP"
          echo "=== twse mis realtime"
          curl -s -D - -H "$O" "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw" -o b2.txt | grep -i "access-control\|^HTTP"; head -c 300 b2.txt
