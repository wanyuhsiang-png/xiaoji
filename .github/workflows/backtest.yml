name: backtest

on:
  push:
    branches: [claude/high-win-rate-stock-trading-8vy1mc]
    paths: ["backtest/**", ".github/workflows/backtest.yml"]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ticker: "0050.TW"
            extra: "--start 2014-01-03"  # Yahoo 2014-01-02 以前的還原價有誤
          - ticker: "006208.TW"
            extra: ""
          - ticker: "00878.TW"
            extra: ""
          - ticker: "2330.TW"
            extra: "--stock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance tabulate
      - name: Backtest ${{ matrix.ticker }}
        run: python backtest/backtest.py --ticker ${{ matrix.ticker }} --fee-discount 0.28 ${{ matrix.extra }} | tee -a "$GITHUB_STEP_SUMMARY"
